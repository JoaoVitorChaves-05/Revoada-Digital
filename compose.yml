services:

  db:
    image: postgres:17.6
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d DevRevoada_Digital"]
      interval: 5s
      timeout: 5s
      retries: 10

    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: Revoada
      POSTGRES_DB: DevRevoada_Digital
    ports:
      - "5432:5432"
    volumes:
      - Revoada_data:/var/lib/postgresql/data
      - ./docker/db:/docker/db

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - ./docker/be:/docker/be

volumes:
  Revoada_data:
