services:

  db:
    image: postgres:17.6
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: Revoada
      POSTGRES_DB: DevRevoada_Digital
    ports:
      - "5432:5432"
    volumes:
      - Revoada_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    env_file:
      - .env.docker
    depends_on:
      - db
    ports:
      - "3000:3000"

volumes:
  Revoada_data:
